spring.application.name=ms-pedidos
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bd_pedidos}
spring.datasource.username=${DB_USER:pedidos_app}
spring.datasource.password=${DB_PASSWORD}
# Seguridad: no crear ni alterar tablas automaticamente por defecto.
# En el primer arranque del laboratorio ejecutar con DB_DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
